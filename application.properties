# Persistent register: a restart does not ingest unchanged files again
camel.beans.register=#class:org.apache.camel.support.processor.idempotent.FileIdempotentRepository
camel.beans.register.fileStore=#class:java.io.File('data/register.dat')
camel.beans.register.cacheSize=100000

# PDFBox warns that the sample PDF does not embed its font
logging.level.org.apache.pdfbox=ERROR
